# Keeps the free Render service awake. Render puts it to sleep after 15 minutes
# without traffic, and waking takes long enough that the app shows "Cannot reach
# the API". A request every few minutes counts as traffic.
#
# GitHub starts scheduled runs late when it is busy, so the schedule asks for
# every 5 minutes to keep the real gap under 15. One service awake all month
# fits in Render's 750 free hours. GitHub disables schedules in a repository
# with no commits for 60 days; re-enable it from the Actions tab.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://datamind-api-a908.onrender.com/api/health
