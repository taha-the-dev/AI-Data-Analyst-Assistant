# Render Blueprint: the API on a free Docker web service. Its database is an
# external PostgreSQL (Neon, free tier) rather than a Render one: a free Render
# database needs a card on file and is deleted 30 days after it is created.
#
# The live service, https://datamind-api-a908.onrender.com, was created by hand
# with these same settings, so this file does not manage it. Applying it as a
# Blueprint creates a separate service.
#
# Free-plan limits worth knowing: the web service sleeps after 15 minutes
# without traffic and takes about a minute to wake.
services:
  - type: web
    name: datamind-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/AnalystAI.Api/Dockerfile
    dockerContext: ./backend/AnalystAI.Api
    # No healthCheckPath on purpose. On 0.1 CPU a request can stall past the
    # health check's 5-second timeout, and Render then restarts the service,
    # which turns a slow moment into a 502. Without one, Render only checks
    # that the port is open.
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      # The Neon connection string, postgresql://...?sslmode=require. A secret:
      # Render asks for it when the Blueprint is applied, and it is never
      # committed. Use Neon's direct connection, not the pooled one.
      - key: ConnectionStrings__Default
        sync: false
      # The Vercel site that proxies /api to this service.
      - key: Security__TrustedOrigins__0
        value: https://datamind-ai-nine.vercel.app
      # Two proxies stand in front of the API: Vercel, then Render's own.
      - key: Security__TrustForwardedHeaders
        value: "true"
      - key: Security__ForwardLimit
        value: "2"
      # Optional: a hosted model for questions. Unset, the built-in planner answers.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
